<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CrowdBet</title>
  <style>
    :root {
      --bg: #0b0f14;
      --card: rgba(255,255,255,0.04);
      --text: #e6edf3;
      --muted: #9aa4b2;
      --accent: #4da3ff;
      --border: rgba(255,255,255,0.10);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;

      /* darker background */
      background:
        radial-gradient(circle at 20% 10%, rgba(255,255,255,0.06), rgba(255,255,255,0) 42%),
        radial-gradient(circle at 80% 20%, rgba(255,255,255,0.05), rgba(255,255,255,0) 46%),
        radial-gradient(circle at 30% 85%, rgba(255,255,255,0.05), rgba(255,255,255,0) 48%),
        radial-gradient(circle at top, #0e0423, #070b16 52%, #04060b 100%);

      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 16px;
      overflow-x: hidden;
    }

    .app {
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding-bottom: 0; /* set dynamically for navbar */
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 12px;
      border-radius: 16px;
      background: transparent;
      border: none;
      backdrop-filter: blur(10px);
      position: sticky;
      top: 12px;
      z-index: 50;
    }

    .header h1 {
      font-size: 16px;
      letter-spacing: 0.4px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .logo {
      width: 18px;
      height: 18px;
      border-radius: 999px;
      background:
        radial-gradient(circle at 30% 30%, rgba(255,255,255,0.85), rgba(255,255,255,0) 45%),
        linear-gradient(135deg, #a855f7, #4c1d95);
      box-shadow:
        0 0 14px rgba(168,85,247,0.28),
        inset 0 0 0 1px rgba(255,255,255,0.14);
      border: 1px solid rgba(0,0,0,0.35);
      flex-shrink: 0;
      position: relative;
    }
    .logo::after {
      content: "";
      position: absolute;
      inset: 5px;
      border-radius: 999px;
      background: rgba(11,15,20,0.55);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.10);
    }

    .pill {
      font-size: 12px;
      padding: 7px 12px;
      border-radius: 999px;
      color: #fff;

      background:
        radial-gradient(circle at 30% 20%, rgba(255,255,255,0.55), rgba(255,255,255,0) 45%),
        linear-gradient(180deg, #a855f7 0%, #7c3aed 50%, #4c1d95 100%);

      border: 2px solid rgba(255,255,255,0.70);

      box-shadow:
        0 6px 0 rgba(0,0,0,0.16),
        0 12px 26px rgba(0,0,0,0.40),
        0 0 18px rgba(255,255,255,0.16),
        0 0 34px rgba(168,85,247,0.18);

      letter-spacing: 0.4px;
      -webkit-text-stroke: 0.6px rgba(70, 30, 120, 0.25);
      text-shadow:
        0 2px 0 rgba(0,0,0,0.22),
        0 0 10px rgba(255,255,255,0.25);
      position: relative;
      overflow: hidden;
      user-select: none;
      font-weight: 400;
    }

    .pill::before {
      content: "";
      position: absolute;
      left: 6px;
      right: 6px;
      top: 4px;
      height: 55%;
      border-radius: 999px;
      background: linear-gradient(180deg, rgba(255,255,255,0.85), rgba(255,255,255,0));
      opacity: 0.45;
      pointer-events: none;
    }

    .pill::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      box-shadow:
        inset 0 6px 10px rgba(255,255,255,0.22),
        inset 0 -8px 12px rgba(0,0,0,0.18);
      pointer-events: none;
    }

    .feed {
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding-bottom: 80px;
    }

    .tweet-card {
      position: relative;
      padding: 16px;
      border-radius: 18px;
      background: linear-gradient(180deg, rgba(255,255,255,0.05), rgba(255,255,255,0.02));
      border: 1px solid rgba(255,255,255,0.10);
      box-shadow: 0 14px 40px rgba(0,0,0,0.35);
      backdrop-filter: blur(10px);
      touch-action: pan-y;
      user-select: none;
      transform: translate3d(0,0,0);
      transition: box-shadow 0.2s ease;
      overflow: hidden;
    }

    .tweet-card:active {
      box-shadow: 0 20px 55px rgba(0,0,0,0.5);
    }

    .top-row {
      display: flex;
      gap: 12px;
      align-items: flex-start;
    }

    .avatar {
      width: 46px;
      height: 46px;
      border-radius: 14px;
      background: linear-gradient(135deg, rgba(255,95,210,0.35), rgba(255,210,90,0.30));
      border: 1px solid rgba(255,255,255,0.12);
      flex-shrink: 0;
    }

    .name-line {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
    }

    .name {
      font-weight: 800;
      font-size: 14px;
    }

    .handle, .time {
      color: var(--muted);
      font-size: 13px;
    }

    .tweet-text {
      margin-top: 10px;
      font-size: 15px;
      line-height: 1.4;
      color: var(--text);
    }

    .meta {
      margin-top: 14px;
      display: flex;
      justify-content: space-between;
      padding-top: 12px;
      border-top: none;
      color: var(--muted);
      font-size: 13px;
    }

    .stamp {
      position: absolute;
      top: 16px;
      padding: 8px 12px;
      border-radius: 14px;
      font-weight: 900;
      letter-spacing: 1px;
      text-transform: uppercase;
      border: 2px solid;
      opacity: 0;
      transform: scale(0.95);
      transition: opacity 0.08s ease, transform 0.08s ease;
      pointer-events: none;
    }

    .stamp.like {
      left: 14px;
      color: #59ffa0;
      border-color: rgba(89,255,160,0.8);
      background: rgba(89,255,160,0.08);
    }

    .stamp.nope {
      right: 14px;
      color: #ff5c87;
      border-color: rgba(255,92,135,0.8);
      background: rgba(255,92,135,0.08);
    }

    .empty {
      text-align: center;
      padding: 30px 16px;
      color: var(--muted);
      border-radius: 18px;
      border: 1px solid rgba(255,255,255,0.10);
      background: rgba(255,255,255,0.02);
    }

    button.reset {
      margin-top: 14px;
      border: none;
      padding: 10px 14px;
      border-radius: 14px;
      background: rgba(255,255,255,0.06);
      color: var(--text);
      border: 1px solid rgba(255,255,255,0.12);
      font-weight: 700;
      cursor: pointer;
    }

    .particles {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 9998;
    }

    .particle {
      position: absolute;
      width: 12px;
      height: 12px;
      border-radius: 999px;
      background: rgba(255,255,255,0.95);
      box-shadow: 0 0 18px rgba(255,255,255,0.55);
      animation: burst 0.7s ease-out forwards;
    }

    @keyframes burst {
      from { transform: translate(0,0) scale(1); opacity: 1; }
      to   { transform: translate(var(--x), var(--y)) scale(0.4); opacity: 0; }
    }

    .combo-box {
      position: fixed;
      z-index: 9999;

      max-width: min(380px, calc(100vw - 44px));
      min-height: 92px;
      padding: 20px 26px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 32px;
      color: #fff;
      text-align: center;

      background:
        radial-gradient(circle at 30% 20%, rgba(255,255,255,0.55), rgba(255,255,255,0) 45%),
        linear-gradient(180deg, #a855f7 0%, #7c3aed 50%, #4c1d95 100%);

      border: 3px solid rgba(255,255,255,0.75);

      box-shadow:
        0 10px 0 rgba(0,0,0,0.18),
        0 18px 50px rgba(0,0,0,0.55),
        0 0 35px rgba(255,255,255,0.22),
        0 0 70px rgba(168,85,247,0.22);

      font-size: clamp(34px, 6vw, 56px);
      font-weight: 1000;
      letter-spacing: 1px;

      -webkit-text-stroke: 2px rgba(70, 30, 120, 0.35);
      text-shadow:
        0 4px 0 rgba(0,0,0,0.22),
        0 0 18px rgba(255,255,255,0.45);

      backdrop-filter: blur(8px);

      animation: comboPop 0.75s cubic-bezier(.2,.9,.2,1) forwards;
      pointer-events: none;
      user-select: none;
      overflow: hidden;
    }

    .combo-box::before {
      content: "";
      position: absolute;
      left: 10px;
      right: 10px;
      top: 8px;
      height: 46%;
      border-radius: 26px;
      background: linear-gradient(180deg, rgba(255,255,255,0.9), rgba(255,255,255,0));
      opacity: 0.55;
      filter: blur(0.2px);
    }

    .combo-box::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      box-shadow:
        inset 0 10px 16px rgba(255,255,255,0.30),
        inset 0 -12px 18px rgba(0,0,0,0.18);
      pointer-events: none;
    }

    @keyframes comboPop {
      0%   { opacity: 0; transform: translateY(10px) scale(0.86); }
      18%  { opacity: 1; transform: translateY(0) scale(1.10); }
      35%  { opacity: 1; transform: translateY(0) scale(1.00); }
      82%  { opacity: 1; transform: translateY(0) scale(1.00); }
      100% { opacity: 0; transform: translateY(-8px) scale(0.96); }
    }

    .bottom-nav {
      position: fixed;
      z-index: 9000;
      color: #e6edf3;
      background: #04060b; /* darker */
      box-shadow:
        0 -16px 30px rgba(0,0,0,0.55),
        0 0 18px rgba(168,85,247,0.06);
      user-select: none;
      touch-action: manipulation;
      padding: 8px 14px calc(12px + env(safe-area-inset-bottom));
      border-radius: 0;
    }

    .bottom-nav-inner {
      width: min(420px, 100%);
      margin: 0 auto;
      display: flex;
      justify-content: space-around;
      gap: 10px;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: #9aa4b2;
      min-width: 92px;
    }

    .nav-icon {
      width: 40px;   /* smaller */
      height: 40px;  /* smaller */
      border-radius: 14px;
      display: grid;
      place-items: center;
      background: transparent;
      border: none;

      filter: grayscale(1) saturate(0.15) drop-shadow(0 6px 10px rgba(0,0,0,0.35));

      color: #e6edf3;
      font-size: 22px; /* smaller */
      line-height: 1;
    }

    .nav-item.active {
      color: #c4b5fd;
    }

    .nav-item.active .nav-icon {
      filter: grayscale(1) saturate(0.22) brightness(1.06)
        drop-shadow(0 10px 18px rgba(0,0,0,0.45))
        drop-shadow(0 0 12px rgba(168,85,247,0.08));
    }
  </style>
</head>

<body>
  <div id="particles" class="particles"></div>
  <div id="comboLayer" class="particles"></div>

  <div class="app" id="app">
    <div class="header">
      <h1><span class="logo"></span> CrowdBet</h1>
      <div class="pill">Bets: <span id="rightCounter">0</span></div>
    </div>

    <div class="feed" id="feed"></div>
  </div>

  <div class="bottom-nav" id="bottomNav">
    <div class="bottom-nav-inner">
      <div class="nav-item active">
        <div class="nav-icon">🏠</div>
        <div>Home</div>
      </div>
      <div class="nav-item">
        <div class="nav-icon">🎲</div>
        <div>Bets</div>
      </div>
      <div class="nav-item">
        <div class="nav-icon">👤</div>
        <div>Profile</div>
      </div>
    </div>
  </div>

  <script>
    const tweetsData = [
      { name:"Nova Reyes", handle:"@novareyes", time:"2m",  text:"Bet: $20 that Argentina wins by 2+ goals tonight. Odds: +185. Who’s tailing?", replies:12, reposts:48, likes:310 },
      { name:"Theo Martinez", handle:"@theom",     time:"8m",  text:"Bet: $15 that BTC closes above $50k this week. Odds: +210. I’m in.", replies:19, reposts:61, likes:982 },
      { name:"Aya K.",       handle:"@aya_k",     time:"12m", text:"Bet: $10 that it rains in BA before Friday. Odds: +160. Prove me wrong.", replies:8, reposts:33, likes:220 },
      { name:"Milo Chen",    handle:"@miloch",    time:"18m", text:"Bet: $25 that the next iPhone announcement mentions “AI” 10+ times. Odds: +130.", replies:41, reposts:120, likes:1420 },
      { name:"Sienna Park",  handle:"@siennap",   time:"25m", text:"Bet: $12 that the under hits on tonight’s game. Odds: +175. Feeling spicy.", replies:17, reposts:54, likes:610 },
      { name:"Ghost in the Shell Script", handle:"@gitscript", time:"33m", text:"Bet: $30 that someone ships a hotfix before lunch. Odds: +145. 😅", replies:6, reposts:22, likes:178 }
    ];

    const feed = document.getElementById("feed");
    const app = document.getElementById("app");

    function makeTweet(tweet) {
      const card = document.createElement("div");
      card.className = "tweet-card";

      card.innerHTML = `
        <div class="stamp like">LIKE</div>
        <div class="stamp nope">NOPE</div>

        <div class="top-row">
          <div class="avatar"></div>
          <div class="content">
            <div class="name-line">
              <span class="name">${tweet.name}</span>
              <span class="handle">${tweet.handle}</span>
              <span class="time">· ${tweet.time}</span>
            </div>

            <div class="tweet-text">${tweet.text}</div>

            <div class="meta">
              <span>💬 ${tweet.replies}</span>
              <span>🔁 ${tweet.reposts}</span>
              <span>❤️ ${tweet.likes}</span>
            </div>
          </div>
        </div>
      `;

      enableSwipe(card);
      return card;
    }

    function enableSwipe(card) {
      const likeStamp = card.querySelector(".stamp.like");
      const nopeStamp = card.querySelector(".stamp.nope");

      let startX = 0;
      let startY = 0;
      let dx = 0;
      let dy = 0;
      let dragging = false;

      const threshold = 120;

      function onDown(e) {
        dragging = true;
        card.style.transition = "none";
        card.setPointerCapture(e.pointerId);
        startX = e.clientX;
        startY = e.clientY;
      }

      function onMove(e) {
        if (!dragging) return;

        dx = e.clientX - startX;
        dy = e.clientY - startY;

        if (Math.abs(dy) > Math.abs(dx) * 1.2) return;

        e.preventDefault();

        const rotate = dx * 0.06;
        card.style.transform = `translate(${dx}px, ${dy}px) rotate(${rotate}deg)`;

        const strength = Math.min(Math.abs(dx) / threshold, 1);

        if (dx > 0) {
          likeStamp.style.opacity = strength;
          likeStamp.style.transform = `scale(${0.95 + strength * 0.1})`;
          nopeStamp.style.opacity = 0;
        } else {
          nopeStamp.style.opacity = strength;
          nopeStamp.style.transform = `scale(${0.95 + strength * 0.1})`;
          likeStamp.style.opacity = 0;
        }
      }

      function onUp() {
        if (!dragging) return;
        dragging = false;

        const dir = dx > 0 ? 1 : -1;

        if (Math.abs(dx) > threshold) {
          if (dx > 0) triggerCombo();

          const flyX = dir * (window.innerWidth + 300);
          const flyY = dy * 1.1;

          card.style.transition = "transform 0.32s cubic-bezier(.18,.95,.22,1), opacity 0.32s ease";
          card.style.transform = `translate(${flyX}px, ${flyY}px) rotate(${dir * 26}deg)`;
          card.style.opacity = "0";

          setTimeout(() => {
            const next = card.nextElementSibling;
            card.remove();
            if (next) {
              next.style.transition = "none";
              next.style.transform = "translateY(10px)";
              next.offsetHeight;
              next.style.transition = "transform 0.35s cubic-bezier(.18,.95,.22,1)";
              next.style.transform = "translateY(0)";
              setTimeout(() => {
                next.style.transition = "";
                next.style.transform = "";
              }, 360);
            }
            checkEmpty();
          }, 280);
        } else {
          card.style.transition = "transform 0.25s cubic-bezier(.2,.9,.2,1)";
          card.style.transform = "";
          likeStamp.style.opacity = 0;
          nopeStamp.style.opacity = 0;
        }

        dx = dy = 0;
      }

      card.addEventListener("pointerdown", onDown);
      card.addEventListener("pointerup", onUp);
      card.addEventListener("pointercancel", onUp);
      card.addEventListener("pointermove", onMove, { passive: false });
    }

    function checkEmpty() {
      if (feed.querySelectorAll(".tweet-card").length === 0) {
        feed.innerHTML = `
          <div class="empty">
            <div style="font-size: 18px; font-weight: 900; margin-bottom: 6px;">No more bets</div>
            <div style="opacity: 0.85;">You swiped them all. Want them back?</div>
            <button class="reset" onclick="resetFeed()">Reset Feed</button>
          </div>
        `;
      }
    }

    function resetFeed() {
      feed.innerHTML = "";
      tweetsData.forEach(t => feed.appendChild(makeTweet(t)));
    }

    window.resetFeed = resetFeed;
    resetFeed();

    let rightSwipeCombo = 0;
    let comboTimeout = null;

    let rightSwipeTotal = 0;
    const rightCounterEl = document.getElementById("rightCounter");
    function updateRightCounter() { rightCounterEl.textContent = rightSwipeTotal; }
    updateRightCounter();

    const particleLayer = document.getElementById("particles");

    function triggerCombo() {
      rightSwipeTotal++;
      updateRightCounter();

      rightSwipeCombo++;

      clearTimeout(comboTimeout);
      comboTimeout = setTimeout(() => (rightSwipeCombo = 0), 60000);

      const labels = ["SWEET!", "TASTY!", "JUICY!", "DELISH!", "CRUSH!", "INSANE!"];
      const label = labels[Math.min(rightSwipeCombo - 1, labels.length - 1)];

      if (navigator.vibrate) navigator.vibrate(25);

      const vv = window.visualViewport;
      const cx = vv ? (vv.width / 2 + vv.offsetLeft) : (window.innerWidth / 2);
      const cy = vv ? (vv.height * 0.45 + vv.offsetTop) : (window.innerHeight * 0.45);

      spawnBurst(cx, cy);
      spawnComboBox(`${label}  x${rightSwipeCombo}`, cx, cy);
    }

    function spawnComboBox(text, x, y) {
      const box = document.createElement("div");
      box.className = "combo-box";
      box.textContent = text;

      box.style.opacity = "0";
      document.body.appendChild(box);

      const vv = window.visualViewport;
      const vw = vv ? vv.width : window.innerWidth;
      const vh = vv ? vv.height : window.innerHeight;
      const ox = vv ? vv.offsetLeft : 0;
      const oy = vv ? vv.offsetTop : 0;

      const margin = 22;

      const w = box.offsetWidth;
      const h = box.offsetHeight;

      const left = Math.min(ox + vw - margin - w, Math.max(ox + margin, x - w / 2));
      const top  = Math.min(oy + vh - margin - h, Math.max(oy + margin, y - h / 2));

      box.style.left = left + "px";
      box.style.top  = top + "px";

      box.style.opacity = "";

      setTimeout(() => box.remove(), 750);
    }

    function spawnBurst(x, y) {
      const count = 18;
      for (let i = 0; i < count; i++) {
        const p = document.createElement("div");
        p.className = "particle";

        const angle = Math.random() * Math.PI * 2;
        const distance = 80 + Math.random() * 120;
        const dx = Math.cos(angle) * distance;
        const dy = Math.sin(angle) * distance;

        p.style.left = x + "px";
        p.style.top = y + "px";
        p.style.setProperty("--x", dx + "px");
        p.style.setProperty("--y", dy + "px");

        const s = 8 + Math.random() * 10;
        p.style.width = s + "px";
        p.style.height = s + "px";

        const colors = ["#a855f7", "#ff5cd8", "#59ffa0", "#ffd859", "#b05cff"];
        const c = colors[Math.floor(Math.random() * colors.length)];
        p.style.background = c;

        particleLayer.appendChild(p);
        setTimeout(() => p.remove(), 700);
      }
    }

    /* Nav positioning */
    const bottomNav = document.getElementById("bottomNav");

    let navRAF = null;
    function scheduleNavPosition() {
      if (navRAF) return;
      navRAF = requestAnimationFrame(() => {
        navRAF = null;
        positionBottomNav();
      });
    }

    function positionBottomNav() {
      const vv = window.visualViewport;
      const vw = vv ? vv.width : window.innerWidth;
      const vh = vv ? vv.height : window.innerHeight;
      const ox = vv ? vv.offsetLeft : 0;
      const oy = vv ? vv.offsetTop : 0;

      bottomNav.style.width = vw + "px";
      bottomNav.style.left = ox + "px";

      const navH = bottomNav.offsetHeight;
      bottomNav.style.top = (oy + vh - navH) + "px";

      app.style.paddingBottom = (navH + 18) + "px";
    }

    positionBottomNav();

    if (window.visualViewport) {
      window.visualViewport.addEventListener("resize", scheduleNavPosition);
      window.visualViewport.addEventListener("scroll", scheduleNavPosition);
    }
    window.addEventListener("resize", scheduleNavPosition);
  </script>
</body>
</html>
